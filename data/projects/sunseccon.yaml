description: "SunSecCon is a volunteer-driven, non-profit initiative dedicated to bridging the gaps between security specialties and fostering collaboration across domains. Designed for practitioners by practitioners, the summit brings together experts in application security, infrastructure security, cloud security, and corporate security to break down silos and promote a unified approach to defensive and offensive security."
